<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>web-chat sessions</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>web-chat</h1>
    <p class="sub">Surfaces running on this machine right now</p>
    <p class="who" id="who" hidden></p>
  </header>
  <p class="state" id="state">Loading…</p>
  <ul class="sessions" id="sessions"></ul>
  <footer>
    <p>A surface appears here while its project's web-chat daemon is running, and
    stops a few seconds after its last viewer leaves. Start one on the host with
    <code>claude-web-chat open</code>.</p>
  </footer>
</main>
</body>
</html>
