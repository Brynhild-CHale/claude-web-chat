# 496+ tests have never run anywhere but a maintainer's Mac, and nothing has ever
# verified Linux — where several of this package's assumptions differ (loopback
# family selection, PID liveness, path casing).
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # `npm test` is `node --test` with NO path argument: passing the directory
      # misresolves and reports a spurious single failure.
      - run: npm test
